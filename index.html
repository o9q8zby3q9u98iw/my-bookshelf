<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Personal Bookshelf</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="top-nav">
        <div class="nav-links">
            <a href="index.html" class="active">Home</a>
            <a href="bookshelf.html">Bookshelf</a>
            <a href="https://linkedin.com/in/yourprofile" target="_blank">LinkedIn</a>
        </div>
    </nav>

    <div class="home-container">
        <img src="WebsiteProfilePhoto/profile.png" alt="Profile Picture" class="profile-pic">
        <h1 id="profileName" class="profile-name"></h1>
        <p id="profileBio" class="profile-bio"></p>
        <button id="openContactBtn" class="btn-email solid">Contact Me</button>
    </div>

    <div id="contactModal" class="modal-overlay">
        <div class="modal-content">
            <button id="closeContactBtn" class="close-btn">&times;</button>
            <h2>Get in touch</h2>
            <form id="emailForm">
                <input type="text" id="senderName" class="form-input" placeholder="Your Name" required>
                <input type="email" id="senderEmail" class="form-input" placeholder="Your Email" required>
                <textarea id="senderMessage" class="form-input" placeholder="Your Message" rows="4" required></textarea>
                <button type="submit" class="btn-email solid">Send Message</button>
                <div id="formStatus"></div>
            </form>
        </div>
    </div>

    <script src="js/home.js"></script>
</body>
</html>
