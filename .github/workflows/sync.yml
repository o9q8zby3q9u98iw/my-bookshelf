name: Nightly Database & Cover Sync

on:
  schedule:
    - cron: '0 8 * * *' # Runs automatically at 8:00 AM UTC every day
  workflow_dispatch: # Gives you a "Run Workflow" button in the GitHub UI to trigger manually

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to allow the bot to commit files back to your repo
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js Environment
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Run Sync Script
        env:
          # Replaced Cloudflare URL with the secure, raw Google Script URL to bypass bot protection
          API_URL: ${{ secrets.GOOGLE_SCRIPT_URL }} 
        run: node scripts/sync-covers.js

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add backup.json images/covers/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-sync: update database fallback and locally cache new covers" && git push)
