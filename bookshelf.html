<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Bookshelf</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="top-nav">
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="bookshelf.html" class="active">Bookshelf</a>
            <a href="https://www.linkedin.com/in/cmhershey" target="_blank">LinkedIn</a>
        </div>
    </nav>

    <div id="main-content" class="container">
        <h1>Personal Bookshelf</h1>
        
        <div class="controls">
            <input type="text" id="searchInput" class="search-input" placeholder="Search...">
            <select id="sortBox" class="sort-select">
                <option value="none">Sort</option>
                <option value="titleAsc">Title (A-Z)</option>
                <option value="titleDesc">Title (Z-A)</option>
                <option value="authorAsc">Author (A-Z)</option>
                <option value="authorDesc">Author (Z-A)</option>
            </select>
        </div>
        
        <div class="bookshelf" id="bookshelf"></div>
    </div>

    <button id="backToTop" class="back-to-top" aria-label="Back to top">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="18 15 12 9 6 15"></polyline>
        </svg>
    </button>

    <script src="js/app.js"></script>
</body>
</html>
