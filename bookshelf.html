<!DOCTYPE html>
<html lang="en">
<!-- Replace the entire <head>...</head> in bookshelf.html with this -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Primary meta -->
    <title>Bookshelf — Charles M. Hershey</title>
    <meta name="description" content="The books Charles M. Hershey is reading and has read — searchable and sortable, with quick AI summaries and Amazon links.">
    <link rel="canonical" href="https://www.charlesmhershey.com/bookshelf.html">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/WebsiteProfilePhoto/profile.png">
    <link rel="apple-touch-icon" href="/WebsiteProfilePhoto/profile.png">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Charles M. Hershey">
    <meta property="og:title" content="Bookshelf — Charles M. Hershey">
    <meta property="og:description" content="The books Charles M. Hershey is reading and has read — searchable and sortable.">
    <meta property="og:url" content="https://www.charlesmhershey.com/bookshelf.html">
    <meta property="og:image" content="https://www.charlesmhershey.com/WebsiteProfilePhoto/profile.png">
    <meta property="og:image:alt" content="Charles M. Hershey">

    <!-- Twitter/X -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Bookshelf — Charles M. Hershey">
    <meta name="twitter:description" content="The books Charles M. Hershey is reading and has read — searchable and sortable.">
    <meta name="twitter:image" content="https://www.charlesmhershey.com/WebsiteProfilePhoto/profile.png">

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/bookshelf.css">
</head>
<body>
    <script src="js/nav.js"></script>
    <site-nav active-page="bookshelf"></site-nav>

    <div id="main-content" class="container">
        <h1>Personal Bookshelf</h1>
        
        <div class="controls">
            <input type="text" id="searchInput" class="search-input" placeholder="Search...">
            <select id="sortBox" class="sort-select">
                <option value="none">Sort</option>
                <option value="titleAsc">Title (A-Z)</option>
                <option value="titleDesc">Title (Z-A)</option>
                <option value="authorAsc">Author (A-Z)</option>
                <option value="authorDesc">Author (Z-A)</option>
            </select>
        </div>
        
        <div class="bookshelf" id="bookshelf"></div>
    </div>

    <!-- Updated Scroll to Top Button with Text Label -->
    <button id="backToTop" class="back-to-top" aria-label="Back to top">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="18 15 12 9 6 15"></polyline>
        </svg>
        <span class="back-to-top-text">Top</span>
    </button>

    <script src="js/app.js"></script>
</body>
</html>
